server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed bundles never change -> cache for a year.
    location ~* \.(?:js|css|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always be re-fetched so new deployments are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Container health probe (Azure / compose).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # SPA fallback: deep links like /item-types go to Angular's router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
