# Production-pointed UI image:  docker compose -f docker-compose.prod.yml up --build
services:
  ui:
    build:
      context: .
      args:
        API_URL: https://api-net.ledger-finance.com
    image: fpfluingimg:prod
    container_name: fpfl-ui-ng
    ports:
      - "8000:8080" # UI-NG -> http://localhost:8000
    restart: unless-stopped
