# Run the UI on its own:  docker compose up --build   (from UI-NG)
services:
  ui:
    build:
      context: .
      args:
        API_URL: http://localhost:8100
    image: fpfluingimg
    container_name: fpfl-ui-ng
    ports:
      - "8000:8080" # UI-NG -> http://localhost:8000
    restart: unless-stopped
