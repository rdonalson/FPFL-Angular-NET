<header class="topbar">
  <div class="topbar__start">
    @if (auth.isAuthenticated()) {
      <button
        type="button"
        class="topbar__menu"
        aria-label="Open menu"
        [attr.aria-expanded]="layout.menuOpen()"
        (click)="layout.toggleMenu()"
      >
        <i class="pi pi-bars" aria-hidden="true"></i>
      </button>
    }
    <a class="topbar__brand" routerLink="/" aria-label="FPFL home">
      <span class="topbar__mark" aria-hidden="true"><i class="pi pi-chart-line"></i></span>
      <span class="topbar__titles">
        <span class="topbar__title">FPFL</span>
        <span class="topbar__subtitle">{{ title }}</span>
      </span>
    </a>
  </div>

  <nav class="topbar__actions" aria-label="Account">
    @if (auth.isAuthenticated()) {
      <span class="topbar__user" [title]="auth.session()?.email ?? ''">
        <i class="pi pi-user" aria-hidden="true"></i>
        <span class="topbar__label">{{ auth.displayName() }}</span>
      </span>

      @if (!auth.isGuest()) {
        <p-button
          icon="pi pi-key"
          label="Change Password"
          [text]="true"
          styleClass="topbar__btn"
          ariaLabel="Change Password"
          (onClick)="ui.openChangePassword()"
        />
      }

      <p-button
        icon="pi pi-sign-out"
        label="Logout"
        [text]="true"
        styleClass="topbar__btn topbar__btn--danger"
        ariaLabel="Logout"
        (onClick)="ui.logout()"
      />
    } @else {
      <p-button
        icon="pi pi-user"
        label="Guest Login"
        [text]="true"
        [loading]="ui.guestLoading()"
        styleClass="topbar__btn"
        ariaLabel="Guest Login"
        (onClick)="ui.loginAsGuest()"
      />
      <p-button
        icon="pi pi-sign-in"
        label="Login"
        styleClass="topbar__btn topbar__btn--primary"
        ariaLabel="Login"
        (onClick)="ui.openLogin()"
      />
      <p-button
        icon="pi pi-user-plus"
        label="Register"
        [text]="true"
        styleClass="topbar__btn"
        ariaLabel="Register"
        (onClick)="ui.openRegister()"
      />
    }

    <a
      class="topbar__repo"
      [href]="repoUrl"
      target="_blank"
      rel="noopener"
      title="View the code on GitHub"
    >
      <i class="pi pi-github" aria-hidden="true"></i>
      <span class="visually-hidden">View the code on GitHub</span>
    </a>

    <a class="topbar__repo topbar__docs" routerLink="/docs" title="Documentation">
      <i class="pi pi-book" aria-hidden="true"></i>
      <span class="visually-hidden">Documentation</span>
    </a>
  </nav>
</header>
