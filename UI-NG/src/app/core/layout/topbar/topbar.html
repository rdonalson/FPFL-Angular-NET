<header class="topbar">
  <a class="topbar__brand" routerLink="/">
    <img class="topbar__avatar" src="images/avatar.jpg" alt="" width="36" height="36" />
    <span class="topbar__title">{{ title }}</span>
  </a>

  <a class="topbar__repo" [href]="repoUrl" target="_blank" rel="noopener">
    <i class="pi pi-github" aria-hidden="true"></i>
    <span class="topbar__repo-text">View the code on GitHub</span>
  </a>
</header>
