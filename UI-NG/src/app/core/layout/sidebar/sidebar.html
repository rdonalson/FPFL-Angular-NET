<ng-template #nav>
  <nav class="sidebar__nav" aria-label="Main">
    @for (section of sections(); track section.label) {
      <div class="sidebar__section">
        <h2 class="sidebar__heading">{{ section.label }}</h2>
        <ul class="sidebar__list" role="list">
          @for (link of section.items; track link.to) {
            <li>
              <a
                class="sidebar__link"
                [routerLink]="link.to"
                routerLinkActive="sidebar__link--active"
                [routerLinkActiveOptions]="{ exact: link.to === '/' }"
                ariaCurrentWhenActive="page"
                (click)="layout.closeMenu()"
              >
                <i [class]="link.icon" aria-hidden="true"></i>
                <span>{{ link.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>

  <p class="sidebar__user">
    <span class="sidebar__initials" aria-hidden="true">{{ initials() }}</span>
    <span class="sidebar__name">{{ auth.displayName() }}</span>
    @if (auth.isAdmin()) {
      <span class="sidebar__role">Admin</span>
    }
  </p>
</ng-template>

<!-- Desktop (992px and up): always-visible side panel -->
@if (auth.isAuthenticated()) {
  <aside class="sidebar-panel">
    <ng-container [ngTemplateOutlet]="nav" />
  </aside>
}

<!-- Tablets and phones: slide-out drawer opened from the top bar -->
<p-drawer
  [visible]="visible()"
  (visibleChange)="visibleChange($event)"
  position="left"
  [modal]="true"
  [blockScroll]="true"
  header="Menu"
  styleClass="sidebar"
>
  <ng-container [ngTemplateOutlet]="nav" />
</p-drawer>
