name: Build and Push FPFL UI-NG to ACR

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'UI-NG/**'
      - 'k8s/ui-ng/**'
      - '.github/workflows/build-push-ui-ng.yml'

env:
  REGISTRY: fpflacr.azurecr.io
  IMAGE_NAME: fpfluingimg

concurrency:
  group: deploy-ui-ng
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./UI-NG
          file: ./UI-NG/Dockerfile
          push: true
          build-args: |
            API_URL=https://api-net.ledger-finance.com
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=ui-ng
          cache-to: type=gha,mode=max,scope=ui-ng

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v4
        with:
          resource-group: FPFL-React-Java
          cluster-name: fpfl-cluster

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/ui-ng/ui-ng-service.yaml
          kubectl apply -f k8s/ui-ng/ui-ng-deployment.yaml
          kubectl apply -f k8s/ui-ng/ui-ng-ingress.yaml

      - name: Force rollout to pull new image
        run: |
          kubectl rollout restart deployment/ui-ng -n fpfl
          kubectl rollout status deployment/ui-ng -n fpfl --timeout=180s
