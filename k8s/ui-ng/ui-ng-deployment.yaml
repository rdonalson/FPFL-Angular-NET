apiVersion: apps/v1
kind: Deployment
metadata:
    name: ui-ng
    namespace: fpfl
    labels:
        app: fpfl-ui-ng
spec:
    replicas: 1
    selector:
        matchLabels:
            app: fpfl-ui-ng
    template:
        metadata:
            labels:
                app: fpfl-ui-ng
        spec:
            nodeSelector:
                workload: fpfl-net
            tolerations:
                - key: workload
                  operator: Equal
                  value: fpfl-net
                  effect: NoSchedule
            securityContext:
                runAsNonRoot: true
            containers:
                - name: ui-ng
                  image: fpflacr.azurecr.io/fpfluingimg:latest
                  imagePullPolicy: Always
                  ports:
                      - containerPort: 8080
                  readinessProbe:
                      httpGet:
                          path: /healthz
                          port: 8080
                      initialDelaySeconds: 2
                      periodSeconds: 10
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: 8080
                      initialDelaySeconds: 10
                      periodSeconds: 20
                  resources:
                      requests:
                          memory: "64Mi"
                          cpu: "50m"
                      limits:
                          memory: "128Mi"
                          cpu: "250m"
