# Whole stack from the repo root:  docker compose up --build
#   UI  -> http://localhost:4280
#   API -> http://localhost:5132  (Swagger at /swagger-ui, health at /health)
# Needs API-NET/.env.docker. PostgreSQL stays on the host (host.docker.internal).
# The browser calls the API directly, so API_URL is the host-published API address.
services:
  api:
    build: ./API-NET
    image: fpflapinetimg
    container_name: fpfl-api-net
    env_file: ./API-NET/.env.docker
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "5132:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ui:
    build:
      context: ./UI-NG
      args:
        API_URL: http://localhost:5132
    image: fpfluingimg
    container_name: fpfl-ui-ng
    ports:
      - "4280:8080"
    depends_on:
      - api
    restart: unless-stopped
